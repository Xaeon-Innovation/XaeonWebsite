name: Web (Next.js) checks

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-ci.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run typecheck

      # Build against the mock API so tests are hermetic (never touch production).
      - name: Start mock API
        run: node e2e/mock-api.mjs &
      - run: npm run build:e2e

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests (Chromium, Firefox, WebKit, mobile)
        run: npm run e2e

      - name: Lighthouse budgets (performance, accessibility, SEO)
        run: |
          npx next start -p 3100 &
          npx --yes wait-on@8.0.1 http://127.0.0.1:3100/robots.txt
          npx --yes @lhci/cli@0.15.1 autorun
        env:
          API_ORIGIN: http://127.0.0.1:4010

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-reports
          path: |
            web/playwright-report
            web/test-results
            web/.lighthouseci
          retention-days: 7
